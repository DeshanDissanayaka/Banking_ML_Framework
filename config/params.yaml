preprocessing:
  numeric_strategy: median
  categorical_strategy: most_frequent
  scale_numeric: false

models:
  logistic_regression:
    max_iter: 1000
    class_weight: balanced
    C: 1.0
  random_forest:
    n_estimators: 300
    max_depth: 12
    min_samples_leaf: 5
    class_weight: balanced
    n_jobs: -1
  extra_trees:
    n_estimators: 300
    max_depth: 12
    min_samples_leaf: 5
    class_weight: balanced
    n_jobs: -1
